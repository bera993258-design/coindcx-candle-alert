name: CoinDCX 15 Minute Candle

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch CoinDCX 15m candles
        env:
          PAIR: B-BTC_USDT
          INTERVAL: 15m
        run: |
          python candle_check.py

      - name: Show latest result
        run: |
          cat output/live_result.json

      - name: Commit generated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Update 15m CoinDCX candle result" || echo "No changes"
          git push
