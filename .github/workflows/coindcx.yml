name: CoinDCX 15m Closed Candle

on:
  workflow_dispatch:

  schedule:
    # 09:46 IST = 04:16 UTC
    - cron: "16 4 * * *"

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch 15m closed candle
        env:
          PAIR: B-BTC_USDT
          INTERVAL: 15m
        run: |
          python candle_check.py

      - name: Show result
        run: |
          cat output/live_result.json

      - name: Commit CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Update 15m closed candle" || echo "No changes"
          git push
